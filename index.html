<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Web App</title>
    <link href="./style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="budget-container">
      <div class="app-title" style="display: flex; justify-content: space-between; align-items: center; padding-right: 20px;">
        <a href=""><span data-i18n="app.title.budget">Budget</span><b data-i18n="app.title.app">App</b></a>
        <a href="./settings.html" style="font-size: 0.8rem; opacity: 0.7;" data-i18n="nav.settings">Settings</a>
      </div>
      <div class="budget-header">
        <div class="balance">
          <div class="title" data-i18n="header.balance">Balance</div>
          <div class="value"><small>$</small>0</div>
        </div>
        <div class="account">
          <div class="income">
            <div class="title" data-i18n="header.income">Income</div>
            <div class="income-total"><small>$</small>0</div>
          </div>
          <div class="chart"></div>
          <div class="outcome">
            <div class="title" data-i18n="header.outcome">Outcome</div>
            <div class="outcome-total"><small>$</small>0</div>
          </div>
        </div>
      </div>
      <div class="budget-dashboard">
        <div class="dash-title" data-i18n="dashboard.title">Dashboard</div>
        <div class="toggle">
          <div class="first-tab" data-i18n="tab.expenses">Expenses</div>
          <div class="second-tab" data-i18n="tab.income">Income</div>
          <div class="third-tab focus" data-i18n="tab.all">All</div>
        </div>
        <div class="hide" id="expense">
          <ul class="list"></ul>
          <div class="input">
            <input
              type="text"
              id="expense-title-input"
              name="title"
              placeholder="title"
              data-i18n-placeholder="input.placeholder.title"
              required 
              maxlength="50"
            />
            <input
              type="number"
              id="expense-amount-input"
              name="amount"
              placeholder="$0"
              data-i18n-placeholder="input.placeholder.amount"
              required
              min="0.01"
              max="9999999"
              step="0.01"
            />
            <div class="add-expense"><img src="icon/plus.png" alt="+" /></div>
          </div>
        </div>
        <div class="hide" id="income">
          <ul class="list"></ul>
          <div class="input">
            <input
              type="text"
              id="income-title-input"
              name="title"
              placeholder="title"
              data-i18n-placeholder="input.placeholder.title"
              required 
              maxlength="50"
            />
            <input
              type="number"
              id="income-amount-input"
              name="amount"
              placeholder="$0"
              data-i18n-placeholder="input.placeholder.amount"
              required
              min="0.01"
              max="9999999"
              step="0.01"
            />
            <div class="add-income"><img src="icon/plus.png" alt="+" /></div>
          </div>
        </div>
        <div id="all">
          <ul class="list"></ul>
        </div>
      </div>
      <div id="toast" class="toast" aria-live="polite" role="status"></div>
    </div>
    <div id="cookie-modal" class="cookie-modal hide" role="dialog" aria-modal="true" aria-labelledby="cookie-title">
      <div class="cookie-banner">
        <h3 id="cookie-title" data-i18n="cookie.title">Cookie Preferences</h3>
        <p><span data-i18n="cookie.message">We use cookies to ensure you get the best experience on our website. Read our </span><a href="./privacy.html" class="privacy-link" data-i18n="cookie.privacy_link">Privacy Policy</a><span data-i18n="cookie.message_end"> for more details.</span></p>
        <div class="cookie-buttons">
          <button id="btn-essential-cookies" class="btn-secondary" data-i18n="cookie.accept_essential">Accept Essential Only</button>
          <button id="btn-all-cookies" class="btn-primary" data-i18n="cookie.accept_all">Accept All Cookies</button>
        </div>
      </div>
    </div>
    <script src="./i18n.js"></script>
    <script src="./chart.js"></script>
    <script src="./budget.js"></script>
  </body>
</html>

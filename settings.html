<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Budget Web App</title>
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <style>
      .settings-section {
        margin-bottom: 24px;
      }
      .settings-section label {
        display: block;
        font-family: "Gilroy Bold", sans-serif;
        color: #1a0034;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }
      .settings-section select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-family: "Gilroy", sans-serif;
        font-size: 0.95rem;
        color: #333;
        background-color: #f9f9f9;
        appearance: auto;
        -webkit-user-select: auto;
        -moz-user-select: auto;
        user-select: auto;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
      }
      .settings-section select:focus {
        border-color: #2a0355;
      }
      .settings-link {
        display: block;
        padding: 12px 0;
        color: #2a0355;
        font-family: "Gilroy Bold", sans-serif;
        font-size: 0.95rem;
        text-decoration: none;
        border-bottom: 1px solid #eee;
        transition: opacity 0.2s;
      }
      .settings-link:hover {
        opacity: 0.7;
      }
      .settings-link::after {
        content: "→";
        float: right;
        opacity: 0.4;
      }
      .btn-reset {
        display: block;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background-color: #f0624d;
        color: #fff;
        font-family: "Gilroy Bold", sans-serif;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn-reset:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="budget-container" style="background-color: #fff; overflow-y: auto;">
      <div class="app-title" style="margin-bottom: 20px;">
        <a href="./index.html" style="color: #1a0034;" data-i18n="settings.back">&larr; Back to App</a>
      </div>
      <div style="padding: 0 20px 20px 20px; color: #333; font-family: 'Gilroy', sans-serif; line-height: 1.6; font-size: 0.95rem;">
        <h2 style="font-family: 'Gilroy Bold', sans-serif; color: #1a0034; text-align: center; margin-bottom: 20px;" data-i18n="settings.title">Settings</h2>

        <!-- Language -->
        <div class="settings-section">
          <label for="language-select" data-i18n="settings.language">Language</label>
          <select id="language-select">
            <option value="en">English</option>
            <option value="cn">中文</option>
          </select>
        </div>

        <!-- Privacy Policy link -->
        <div class="settings-section">
          <a href="./privacy.html" class="settings-link" data-i18n="settings.privacy_policy">Privacy Policy</a>
        </div>

        <!-- Reset -->
        <div class="settings-section" style="margin-top: 40px;">
          <button id="btn-reset-app" class="btn-reset" data-i18n="settings.reset_app">Reset App</button>
        </div>
      </div>
    </div>

    <script src="./i18n.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
